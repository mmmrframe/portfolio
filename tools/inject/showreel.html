<style id="reel-css">#reel-modal{position:fixed;inset:0;z-index:2147483000;display:none;align-items:center;justify-content:center;padding:clamp(16px,4vw,56px);background:rgba(8,8,8,.92);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}#reel-modal.on{display:flex}#reel-modal .box{position:relative;width:min(100%,calc((100vh - 112px)*16/9));aspect-ratio:16/9;border-radius:14px;overflow:hidden;background:#000;box-shadow:0 30px 80px rgba(0,0,0,.6)}#reel-modal iframe{position:absolute;inset:0;width:100%;height:100%;border:0}#reel-modal .x{position:absolute;top:clamp(10px,2vw,22px);right:clamp(10px,2vw,22px);width:44px;height:44px;border-radius:999px;border:1px solid rgba(255,255,255,.2);background:rgba(20,20,20,.8);color:#f2efe9;font:400 22px/1 Inter,system-ui,sans-serif;cursor:pointer}#reel-modal .x:hover{background:#BEA98E;color:#111;border-color:#BEA98E}</style>
<script id="reel-js">(function(){var SRC="https://player.vimeo.com/video/330892454?title=0&byline=0&portrait=0&badge=0&autopause=0&player_id=0&app_id=58479&autoplay=1";
function modal(){var m=document.getElementById("reel-modal");if(m)return m;m=document.createElement("div");m.id="reel-modal";m.setAttribute("role","dialog");m.setAttribute("aria-label","Шоурил");
m.innerHTML='<button class="x" type="button" aria-label="Закрыть">×</button><div class="box"></div>';document.body.appendChild(m);
m.addEventListener("click",function(e){if(e.target===m||e.target.closest(".x"))close()});return m}
function open(){var m=modal();m.querySelector(".box").innerHTML='<iframe src="'+SRC+'" allow="autoplay; fullscreen; picture-in-picture; clipboard-write; encrypted-media; web-share" referrerpolicy="strict-origin-when-cross-origin" title="Шоурил"></iframe>';m.classList.add("on");document.documentElement.style.overflow="hidden"}
function close(){var m=document.getElementById("reel-modal");if(!m)return;m.classList.remove("on");m.querySelector(".box").innerHTML="";document.documentElement.style.overflow=""}
document.addEventListener("click",function(e){var a=e.target.closest&&e.target.closest('a[href*="vimeo.com/76979871"],a[href*="vimeo.com/330892454"]');if(!a)return;e.preventDefault();e.stopImmediatePropagation();open()},true);
document.addEventListener("keydown",function(e){if(e.key==="Escape")close()})})();</script>
