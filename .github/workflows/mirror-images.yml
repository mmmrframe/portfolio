name: Mirror images from Framer

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["assets/data.js", "tools/fetch_images.py", ".github/workflows/mirror-images.yml"]

permissions:
  contents: write

jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: python tools/fetch_images.py
      - name: Commit images
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A assets
          git diff --cached --quiet || (git commit -m "Mirror images from Framer CDN into assets/img" && git push)
