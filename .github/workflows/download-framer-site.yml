name: Download Framer site

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["tools/download_framer_site.py", ".github/workflows/download-framer-site.yml"]

jobs:
  download:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install playwright && python -m playwright install --with-deps chromium
      - run: python tools/download_framer_site.py
      - uses: actions/upload-artifact@v4
        with:
          name: mrframe-framer-site
          path: framer-site
          retention-days: 90
